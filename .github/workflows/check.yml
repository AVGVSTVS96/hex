name: check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: the store's object on Cloudflare's runtime (workerd, through the wrangler bin/hex deploys with)
        run: bun test --timeout 300000 ./hub/store/workerd.ts
